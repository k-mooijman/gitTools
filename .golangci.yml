---
version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default: major

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
  exclusions:
    generated: lax
    paths:
      - '\\.go$'
      - third_party$
      - builtin$
      - examples$

linters:
  default: all
  disable:
    - depguard        # disabled until we manage dependencies
    - exhaustruct     # structs may be uninitialized
    - nlreturn        # covered by wsl cuddle rules
    - nonamedreturns  # named returns are acceptable
    - paralleltest    # tests are acceptable in sequence
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - errchkjson
          - forcetypeassert
          - funlen
          - gochecknoglobals
          - goconst
          - wrapcheck
      # determine what logic is more readable per case
      - linters: [staticcheck]
        text: QF1001
      # you can type out all anonymous fields if more readable
      - linters: [staticcheck]
        text: QF1008
    paths:
      - '\\.go$'
      - third_party$
      - builtin$
      - examples$
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (io.ReadWriteCloser).Close
        - (*os.File).Close
    errchkjson:
      check-error-free-encoding: true
    gosec:
      excludes:
        - G104  # Errors unhandled. Already covered by errcheck linter.
        - G307  # Deferring a method which returns an error. Already covered by errcheck linter.
        - G601  # No longer applicable since go v1.22 update to for loops.
    govet:
      enable-all: true
      disable:
        - fieldalignment   # misalignment is accepted
    mnd:
      ignored-numbers:
        - "2"
        - "4"
        - "8"
        - "16"
        - "32"
        - "64"
        - "10"
        - "100"
        - "1000"
    nolintlint:
      require-explanation: true
    revive:
      # see https://github.com/mgechev/revive#recommended-configuration
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    staticcheck:
      checks:
        - all
    tagliatelle:
      case:
        rules:
          json: goCamel
          yaml: snake
    varnamelen:
      min-name-length: 1
    wrapcheck:
      ignore-package-globs:
        - golang.org/x/sync/errgroup
    wsl:
      force-err-cuddling: true
